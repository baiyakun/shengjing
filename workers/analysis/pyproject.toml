[project]
name = "shengjing-analysis-worker"
version = "0.1.0"
license = "MIT"
description = "声境分析进程（扩展包）：说话人区分、词级时间戳、人声分离、人声检测"
requires-python = ">=3.13"
dependencies = [
    "shengjing-worker-kit",
    "numpy>=2.0",
    "soundfile>=0.13",
    "torch>=2.6",
    "pyannote.audio>=4.0",
    "qwen-asr>=0.0.6",
    "demucs>=4.1",
    "silero-vad>=6.0",
]

[tool.uv.sources]
shengjing-worker-kit = { path = "../worker-kit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
