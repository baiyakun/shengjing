[project]
name = "shengjing-speech-worker"
version = "0.1.0"
description = "声境语音进程：用 mlx-speech 在 Apple Silicon 上跑 TTS、ASR、音效、录音编辑"
requires-python = ">=3.13"
dependencies = [
    "shengjing-worker-kit",
    "numpy>=2.0",
    # mlx-speech 只能装在 Apple Silicon 的 macOS 上
    "mlx-speech>=0.5.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv.sources]
shengjing-worker-kit = { path = "../worker-kit", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
