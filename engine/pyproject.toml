[project]
name = "shengjing-engine"
version = "0.1.0"
description = "声境主引擎：任务调度、模型进程管理、LLM 编排、混音导出"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "msgpack>=1.0",
    "httpx>=0.27",
    "pydantic>=2.8",
    "numpy>=2.0",
    "keyring>=25",
]

[project.scripts]
shengjing-engine = "shengjing_engine.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-markers"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
