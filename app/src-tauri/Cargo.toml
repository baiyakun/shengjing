[package]
name = "shengjing"
version = "0.1.0"
description = "声境：本地 AI 有声内容工作室"
edition = "2021"
rust-version = "1.80"

[lib]
name = "shengjing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
